version: 'v1'
name: memory-ratio
title: Memory limit must not exceed 1.5 times the memory request.

files:
  included:
    - tests/manual/*.yml
    
scope:
  format: yaml
  path: $.*.container

filter:
  all:
    - non_empty: $.data.resources.requests.memory
    - non_empty: $.data.resources.limits.memory

rule: Memory limit must be less than or equal to memory request * 1.5. Compare both values in the same units.

examples:
  good:
    - |
      # limit equals request, so the ratio is 1.0 and stays below 1.5x
        requests:
          memory: 512Mi
        limits:
          memory: 512Mi
    - |
      # limit is exactly 1.5x request, so the boundary is compliant
        requests:
          memory: 512Mi
        limits:
          memory: 768Mi
    - |
      # mixed units: 1536Mi is exactly 1.5x the 1Gi request
        requests:
          memory: 1Gi
        limits:
          memory: 1536Mi
  bad:
    - |
      # limit is 2x request, which exceeds 1.5x
        requests:
          memory: 512Mi
        limits:
          memory: 1Gi
