version: 'v1'
files:
  included:
    - tests/manual/proto/public/*.proto
scope:
  format: protobuf
  path: $.rpcs[*].http.bindings[*].url
check:
  kind: regex
  rule: '^/v\d+/[a-z][a-z0-9_]*s(?:/.*)?$'
  violation-message: Public endpoints must start with a version /vX/ followed by a resource in plural form.
