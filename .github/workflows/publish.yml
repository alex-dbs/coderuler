name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const expectedTag = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Release tag must equal ${expectedTag}`);
          }

          const distTag = version.split('+')[0].includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${distTag}\n`);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --tag "$NPM_DIST_TAG"
