name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.15.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
      - run: gem install ruby-lsp --version 0.26.11 --no-document
      - run: bundle install --gemfile tests/fixtures/ruby-lsp/project/Gemfile
      - run: GOBIN="$RUNNER_TEMP/gopls-bin" go install golang.org/x/tools/gopls@v0.24.0
      - run: echo "$RUNNER_TEMP/gopls-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
      - run: node dist/cli.js deps sync --directory .coderuler.examples
      - run: npm run typecheck
