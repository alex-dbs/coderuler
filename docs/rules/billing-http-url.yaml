version: 'v1'
name: Billing HTTP URLs
files:
  included:
    - proto/billing/**/*.proto
  excluded:
    - proto/billing/generated/**
scope:
  format: protobuf
  path: $.rpcs[*]
filter:
  non_empty: $.data.http.bindings
rule: HTTP URL resource segments must use plural nouns, not operation names such as getInvoice or createPayment. Version segments, service prefixes such as billing, and path parameters such as {invoice_id} are allowed.
examples:
  good:
    # plural resource segment; the version segment and billing prefix are allowed
    - |
      option (google.api.http) = { get: "/v1/billing/invoices" };
    # plural resource segment with an allowed {invoice_id} path parameter
    - |
      option (google.api.http) = { get: "/v1/billing/invoices/{invoice_id}" };
  bad:
    # operation name instead of a plural resource segment
    - |
      option (google.api.http) = { get: "/v1/billing/getInvoice" };
    # operation name instead of a plural resource segment
    - |
      option (google.api.http) = { post: "/v1/billing/createPayment" };
    # singular resource segment
    - |
      option (google.api.http) = { get: "/v1/billing/invoice" };
